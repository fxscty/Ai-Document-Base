[project]
name = "ai-document-base"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "fxscty", email = "shinkevichdmitriy5@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.15.0",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.163.1",
    "langchain-text-splitters>=1.1.3",
    "pgvector>=0.5.1",
    "pwdlib[argon2]>=0.4.2",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "pymupdf>=2.1",
    "python-docx>=1.2.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "tiktoken>=0.14.0",
]

[project.scripts]
ai-document-base = "ai_document_base:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.16.1",
]

[tool.uv]
package = false
